<rect x="0" y="0" width="1300" height="820" fill="url(#bg)"/>
<rect x="32" y="30" width="1236" height="760" rx="24" fill="#ffffff" stroke="#d9e7e5" stroke-width="2"/>
<text x="70" y="58" fill="#0f766e" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700">Spring Boot Concept Flow</text>
<text x="70" y="85" fill="#1f2937" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">How do Eureka, Config Server, Gateway, and Circuit Breakers fit</text>
<text x="70" y="119" fill="#1f2937" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">together?</text>
