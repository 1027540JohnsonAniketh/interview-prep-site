name: CI CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend files
        run: python -m py_compile backend/main.py backend/python_quest.py

      - name: Run backend tests
        run: python -m unittest backend.tests.test_python_quest

      - name: Validate frontend script syntax
        run: node --check frontend/app.js

  ios-build:
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/PythonQuestCompanion
        run: xcodegen generate

      - name: Build iOS app
        working-directory: ios/PythonQuestCompanion
        run: xcodebuild -project PythonQuestCompanion.xcodeproj -scheme PythonQuestCompanion -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO build

  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - web-backend
      - ios-build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Note Render auto deploy path
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "No RENDER_DEPLOY_HOOK_URL secret is configured."
          echo "If your Render service is linked to GitHub with auto-deploy enabled, the push to main will still redeploy."
          echo "If not, add a Render deploy hook as the RENDER_DEPLOY_HOOK_URL repository secret."
